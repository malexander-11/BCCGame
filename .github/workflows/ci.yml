name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The engine is easy to break in a way that still looks plausible ball by
      # ball, so the calibration harness gates every push.
      - name: Check the engine is still calibrated
        run: npm run bench

      - name: Build
        run: npm run build
